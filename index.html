<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Although / Despite · Домашняя работа</title><style>
:root{--size:50px;--bg:#ece8e0;--ink:#354039;--soft:#dfe4d9;--edge:#b5beb1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.45}header,footer{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:18px 4vw;flex-wrap:wrap}button{font:inherit;font-size:23px;padding:13px 22px;border-radius:13px;border:1px solid var(--edge);background:var(--soft);color:var(--ink);cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #71816d;outline-offset:4px}button:disabled{opacity:.5;cursor:default}header{font-size:19px}header button{font-size:21px;padding:8px 15px}.tools{display:flex;gap:9px}main{max-width:1150px;margin:auto;min-height:68dvh;padding:28px 5vw;display:flex;flex-direction:column;justify-content:center}h1{font-size:var(--size);font-weight:500;line-height:1.35;margin:0 0 28px}#sub{font-size:28px;margin:0 0 28px;color:#56634f}#example{font-size:calc(var(--size) * .86);margin:0}#options{display:flex;gap:16px;flex-wrap:wrap;margin-top:26px}#options button{font-size:36px;padding:17px 25px}#options button.selected{outline:3px solid #75846e;background:#d2ddca}input{font:inherit;font-size:40px;background:#f5f2eb;color:var(--ink);border:2px solid var(--edge);border-radius:12px;padding:14px 18px;width:min(100%,540px);margin:25px 0 0}#feedback{font-size:27px;line-height:1.5;margin-top:24px;padding:18px 22px;background:#dfe5d9;border-radius:12px}#feedback.wrong{background:#e8dfd1}#feedback b{font-size:30px}#hint{font-size:23px;margin:20px 0 0;color:#56634f}#progress{height:4px;background:#d0d5c8}#bar{height:100%;background:#819476}#check{margin-top:24px;align-self:flex-start;background:#cfdcc8}#summary{font-size:30px}#summary button{margin:8px} [hidden]{display:none!important}@media(max-width:650px){:root{--size:37px}main{min-height:65dvh;padding:24px 7vw}#sub{font-size:24px}#options button{font-size:29px}input{font-size:34px}#feedback{font-size:23px}footer button{font-size:19px}} </style></head><body><header><span id="label">WORK · HOMEWORK</span><div class="tools"><button id="minus" aria-label="Уменьшить шрифт">A−</button><button id="plus" aria-label="Увеличить шрифт">A+</button><button id="rule">Правило</button></div><span id="counter"></span></header><div id="progress"><div id="bar"></div></div><main aria-live="polite"><p id="sub"></p><h1 id="title"></h1><p id="example"></p><p id="hint" hidden></p><div id="options"></div><input id="input" aria-label="Введите форму глагола" autocomplete="off" autocapitalize="none" spellcheck="false" hidden><button id="check" hidden>Проверить</button><div id="feedback" role="status" hidden></div><div id="summary" hidden></div></main><footer><button id="back">← Назад</button><button id="next">Далее →</button></footer><script>
const rules=[["Although = хотя", "Although + кто + что делает", "Although she works overtime, she earns the minimum wage."], ["Despite = несмотря на", "Despite + существительное", "Despite her heavy workload, she helps her colleagues."], ["Despite + действие", "Despite + глагол с -ing", "Despite working overtime, she earns the minimum wage."], ["Две частые ошибки", "После despite не ставим of.", "После although не добавляем but: Although the job is demanding, I like it."]],qs=[{"text": "___ she has a demanding job, she enjoys it.", "answer": "Although", "explain": "После пропуска есть she + has: нужна связка although.", "options": ["Although", "Despite"]}, {"text": "___ her heavy workload, she helps her team.", "answer": "Despite", "explain": "Her heavy workload — группа существительного: despite.", "options": ["Although", "Despite"]}, {"text": "___ working overtime, he didn’t get a raise.", "answer": "Despite", "explain": "Working — форма -ing: despite.", "options": ["Although", "Despite"]}, {"text": "___ it is an entry-level job, it pays well.", "answer": "Although", "explain": "It + is: после although идёт подлежащее и глагол.", "options": ["Although", "Despite"]}, {"text": "___ she earns the minimum wage, she likes her job.", "answer": "Although", "explain": "She + earns: нужна связка although.", "options": ["Although", "Despite"]}, {"text": "___ being a good team player, he was dismissed.", "answer": "Despite", "explain": "Being — форма -ing: despite.", "options": ["Although", "Despite"]}, {"text": "___ getting a promotion, she wants to leave.", "answer": "Despite", "explain": "Getting — форма -ing: despite.", "options": ["Although", "Despite"]}, {"text": "___ he did an internship, he couldn’t find a job.", "answer": "Although", "explain": "He + did: нужна связка although.", "options": ["Although", "Despite"]}, {"text": "Despite ___ overtime, she didn’t get a promotion.", "answer": "working", "explain": "После despite используем -ing: working.", "options": ["work", "working", "she works"]}, {"text": "Although ___ a demanding job, he enjoys it.", "answer": "he has", "explain": "После although нужно кто + что делает: he has.", "options": ["having", "his", "he has"]}, {"text": "___ the low salary, she accepted the entry-level job.", "answer": "Despite", "explain": "Перед the low salary используем despite без of.", "options": ["Despite of", "Although", "Despite"]}, {"text": "Although he got a raise, ___ still unhappy.", "answer": "he is", "explain": "После придаточного с although не добавляем but.", "options": ["but he is", "he is", "despite he is"]}, {"text": "Despite ___ a demanding job, she has time for her family.", "answer": "having", "explain": "Have → having: после despite используем -ing.", "options": null}, {"text": "Despite ___ the minimum wage, he enjoys his work.", "answer": "earning", "explain": "Earn → earning: после despite используем -ing.", "options": null}, {"text": "Despite ___ an internship, she couldn’t find a job.", "answer": "doing", "explain": "Do → doing: после despite используем -ing.", "options": null}, {"text": "Despite ___ a good team player, he was fired.", "answer": "being", "explain": "Be → being: после despite используем -ing.", "options": null}];let page=0,selected='',returnPage=null,font=innerWidth<650?37:50;const state=qs.map(()=>({value:'',attempts:0,first:null,done:false,feedback:''}));const $=id=>document.getElementById(id);const norm=s=>s.trim().toLowerCase().replace(/[.!?]+$/,'');
function render(){selected='';['input','check','feedback','summary','hint'].forEach(id=>$(id).hidden=true);$('options').replaceChildren();$('example').textContent='';$('title').hidden=false;$('back').disabled=page===0;$('next').hidden=false;$('next').textContent='Далее →';$('bar').style.width=100*Math.min(page+1,rules.length+qs.length+1)/(rules.length+qs.length+1)+'%';
if(page<rules.length){let r=rules[page];$('label').textContent='ПРАВИЛО';$('counter').textContent=(page+1)+' / '+rules.length;$('sub').textContent=r[0];$('title').textContent=r[1];$('example').textContent=r[2];if(returnPage!==null)$('next').textContent='Вернуться к заданию →';return;}
let n=page-rules.length;if(n===qs.length){finish();return;}let q=qs[n],s=state[n];$('label').textContent='ПРАКТИКА';$('counter').textContent=(n+1)+' / '+qs.length;$('sub').textContent=q.options?'Выберите вариант и нажмите «Проверить».':'Впишите форму -ing.';$('title').textContent=q.text;selected=s.value;
if(q.options){q.options.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.disabled=s.done;b.className=v===selected?'selected':'';b.setAttribute('aria-pressed',String(v===selected));b.onclick=()=>{selected=v;s.value=v;$('feedback').hidden=true;for(let c of $('options').children){c.classList.toggle('selected',c.textContent===v);c.setAttribute('aria-pressed',String(c.textContent===v));}};$('options').append(b)})}else{$('input').hidden=false;$('input').value=s.value;$('input').disabled=s.done;$('hint').hidden=false;$('hint').textContent='Глагол: '+['have','earn','do','be'][n-12];}
$('check').hidden=s.done;$('next').disabled=false;if(s.feedback){$('feedback').hidden=false;$('feedback').className=s.done?'':'wrong';$('feedback').textContent=s.feedback;}}
function check(){let n=page-rules.length,q=qs[n],s=state[n];if(!q||s.done)return;let val=q.options?selected:$('input').value;s.value=val;if(!val.trim()){$('feedback').hidden=false;$('feedback').textContent='Сначала выберите или введите ответ.';return;}s.attempts++;let ok=norm(val)===norm(q.answer);if(s.first===null)s.first=ok;s.done=ok;s.feedback=ok?'Верно! '+q.explain:'Попробуйте ещё раз. '+(q.options?'Посмотрите, что идёт после пропуска: кто + действие, существительное или -ing.':'После despite нужна форма -ing.');render();}
function finish(){$('label').textContent='РЕЗУЛЬТАТ';$('counter').textContent='';$('sub').textContent='';$('title').textContent='Ваш результат';let done=state.filter(s=>s.done).length,first=state.filter(s=>s.first===true).length;$('summary').hidden=false;$('summary').textContent='Выполнено: '+done+' из '+qs.length+'. С первой попытки: '+first+' из '+qs.length+'. ';if(done<qs.length){let b=document.createElement('button');b.textContent='Доделать задания';b.onclick=()=>{page=rules.length+state.findIndex(s=>!s.done);render()};$('summary').append(b)}let b=document.createElement('button');b.textContent='Начать заново';b.onclick=()=>{state.forEach(s=>Object.assign(s,{value:'',attempts:0,first:null,done:false,feedback:''}));page=0;render()};$('summary').append(b);$('next').hidden=true;}
$('check').onclick=check;$('input').onkeydown=e=>{if(e.key==='Enter')check()};$('next').onclick=()=>{if(returnPage!==null&&page<rules.length){page=returnPage;returnPage=null}else page=Math.min(rules.length+qs.length,page+1);render()};$('back').onclick=()=>{page=Math.max(0,page-1);render()};$('rule').onclick=()=>{if(page>=rules.length)returnPage=page;page=0;render()};$('plus').onclick=()=>{font=Math.min(80,font+4);document.documentElement.style.setProperty('--size',font+'px')};$('minus').onclick=()=>{font=Math.max(32,font-4);document.documentElement.style.setProperty('--size',font+'px')};render();
</script></body></html>
